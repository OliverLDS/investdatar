FRED:
  data_path: ./data/fred
  registry_file: ./config/fred_macro_series_registry.json

WorldBank:
  data_path: ./data/world_bank
  registry_file: ./config/world_bank_series_registry.json

Treasury:
  data_path: ./data/treasury

CFTC:
  data_path: ./data/cftc
  registry_file: ./config/cftc_cot_registry.json

FiscalData:
  data_path: ./data/fiscal_data
  registry_file: ./config/fiscaldata_registry.json

EIA:
  data_path: ./data/eia
  registry_file: ./config/eia_series_registry.json
  # API key is read from EIA_API_KEY when omitted here.

SEC:
  data_path: ./data/sec
  registry_file: ./config/sec_company_registry.json
  frames_registry_file: ./config/sec_frames_registry.json
  # Identifiable contact is required, e.g. Name email@example.com.
  # user_agent: Your Name your_email@example.com

SDMX:
  data_path: ./data/sdmx
  registry_file: ./config/sdmx_series_registry.json

RSS:
  data_path: ./data/rss
  registry_file: ./config/rss_feed_registry.json
  # Request-scoped override for runtimes whose default CA bundle lacks Sectigo Root R46.
  # feed_ca_bundles:
  #   cftc_press_releases: /absolute/path/to/current-ca-bundle.pem

Crypto:
  data_path: ./data/crypto
  derivatives_registry_file: ./config/crypto_derivatives_registry.json
  # Optional OKX auth fields for okxr-backed calls:
  # api_key: your_okx_key
  # secret_key: your_okx_secret
  # passphrase: your_okx_passphrase

iShare:
  data_path: ./data/ishare
  registry_file: ./config/ishare_ticker_registry.json
  holdings_tickers: [DYNF, THRO, BAI, BDYN, BDVL]

YahooFinance:
  data_path: ./data/yahoo_finance
  registry_file: ./config/YahooFinance_ticker_registry.json

AlphaVantage:
  data_path: ./data/alphavantage
  registry_file: ./config/alphavantage_series_registry.json
  note: API key is read from ALPHAVANTAGE_API_KEY

BLS:
  data_path: ./data/bls
  registry_file: ./config/bls_series_registry.json

BEA:
  data_path: ./data/bea
  registry_file: ./config/bea_series_registry.json

Census:
  data_path: ./data/census
  registry_file: ./config/census_series_registry.json
